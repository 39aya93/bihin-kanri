<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#1976d2">

<link rel="manifest" href="manifest.json">

<title>備品管理</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans JP",
    sans-serif;
  background: #f3f4f6;
  color: #333;
}

header {
  background: #1976d2;
  color: white;
  padding: 14px 16px;
  position: sticky;
  top: 0;
  z-index: 10;
}

header h1 {
  margin: 0;
  font-size: 20px;
}

main {
  max-width: 700px;
  margin: auto;
  padding: 12px;
}

button {
  border: none;
  border-radius: 8px;
  padding: 11px 15px;
  font-size: 15px;
  cursor: pointer;
}

.primary {
  background: #1976d2;
  color: white;
}

.secondary {
  background: #e5e7eb;
  color: #333;
}

.danger {
  background: #d32f2f;
  color: white;
}

.full {
  width: 100%;
}

.menu {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 15px;
}

.search-box {
  display: flex;
  gap: 8px;
  margin-bottom: 15px;
}

.search-box input {
  flex: 1;
}

input,
select,
textarea {
  width: 100%;
  padding: 11px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 7px;
  background: white;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

.form-group {
  margin-bottom: 14px;
}

.form-group label {
  display: block;
  font-weight: bold;
  margin-bottom: 5px;
}

.card {
  background: white;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 10px;
  box-shadow: 0 1px 4px rgba(0,0,0,.12);
}

.item-card {
  display: flex;
  gap: 12px;
  cursor: pointer;
}

.item-image {
  width: 90px;
  height: 90px;
  object-fit: cover;
  border-radius: 7px;
  background: #eee;
  flex-shrink: 0;
}

.item-info {
  flex: 1;
  min-width: 0;
}

.item-name {
  font-weight: bold;
  font-size: 17px;
  margin-bottom: 6px;
}

.item-location {
  color: #555;
  margin-bottom: 4px;
}

.expired {
  color: #d32f2f;
  font-weight: bold;
}

.expiring {
  color: #ef6c00;
  font-weight: bold;
}

.detail-image {
  width: 100%;
  max-height: 350px;
  object-fit: contain;
  background: #eee;
  border-radius: 8px;
  margin-bottom: 15px;
}

.detail-row {
  padding: 10px 0;
  border-bottom: 1px solid #eee;
}

.detail-label {
  font-size: 13px;
  color: #777;
}

.detail-value {
  font-size: 16px;
  margin-top: 3px;
  white-space: pre-wrap;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 15px;
}

.hidden {
  display: none !important;
}

.preview {
  width: 100%;
  max-height: 250px;
  object-fit: contain;
  margin-top: 8px;
  border-radius: 8px;
  background: #eee;
}

.empty {
  text-align: center;
  color: #777;
  padding: 30px 10px;
}

.small {
  font-size: 13px;
  color: #777;
}

hr {
  border: none;
  border-top: 1px solid #ddd;
  margin: 18px 0;
}
</style>
</head>

<body>

<header>
  <h1>📦 備品管理</h1>
</header>

<main>

  <!-- メニュー -->
  <section id="homeScreen">

    <div class="menu">
      <button class="primary" onclick="showRegister()">
        ＋ 備品を登録
      </button>

      <button class="secondary" onclick="showAllItems()">
        📋 一覧を見る
      </button>
    </div>

    <div class="search-box">
      <input
        id="searchInput"
        type="search"
        placeholder="名称・保管場所で検索">
      <button class="primary" onclick="searchItems()">
        🔎
      </button>
    </div>

    <div id="itemList"></div>

    <hr>

    <button class="secondary full" onclick="exportBackup()">
      💾 バックアップを書き出す
    </button>

    <br><br>

    <label class="secondary full"
           style="display:block;text-align:center;cursor:pointer;">
      ♻️ バックアップを復元
      <input
        type="file"
        accept=".json"
        style="display:none"
        onchange="importBackup(event)">
    </label>

  </section>


  <!-- 登録・編集 -->
  <section id="formScreen" class="hidden">

    <div class="card">

      <h2 id="formTitle">備品登録</h2>

      <div class="form-group">
        <label>名称</label>
        <input id="name" type="text">
      </div>

      <div class="form-group">
        <label>仕様（サイズ）</label>
        <input id="spec" type="text">
      </div>

      <div class="form-group">
        <label>画像</label>

        <input
          id="image"
          type="file"
          accept="image/*"
          capture="environment">

        <img id="preview"
             class="preview hidden">
      </div>

      <div class="form-group">
        <label>保管場所</label>
        <input id="location" type="text"
               list="locationList">

        <datalist id="locationList">
        </datalist>
      </div>

      <div class="form-group">
        <label>入手時期</label>
        <input id="obtained" type="date">
      </div>

      <div class="form-group">
        <label>保管期限</label>
        <input id="expiry" type="date">
      </div>

      <div class="form-group">
        <label>購入先</label>
        <input id="store" type="text"
               list="storeList">

        <datalist id="storeList">
        </datalist>
      </div>

      <div class="form-group">
        <label>価格</label>
        <input id="price"
               type="number"
               inputmode="numeric">
      </div>

      <div class="form-group">
        <label>備考</label>
        <textarea id="memo"></textarea>
      </div>

      <button
        class="primary full"
        onclick="saveItem()">
        💾 保存する
      </button>

      <br><br>

      <button
        class="secondary full"
        onclick="showHome()">
        戻る
      </button>

    </div>

  </section>


  <!-- 詳細 -->
  <section id="detailScreen" class="hidden">

    <div class="card">

      <div id="detailContent"></div>

      <div class="actions">

        <button
          class="primary"
          onclick="editCurrentItem()">
          ✏️ 編集
        </button>

        <button
          class="danger"
          onclick="deleteCurrentItem()">
          🗑️ 削除
        </button>

      </div>

      <br>

      <button
        class="secondary full"
        onclick="showHome()">
        戻る
      </button>

    </div>

  </section>

</main>


<script>

const DB_NAME = "BihinKanriDB";
const DB_VERSION = 1;
const STORE_NAME = "items";

let db;
let currentItemId = null;
let editingId = null;
let selectedImageData = null;


/* =========================
   IndexedDB
========================= */

function openDB() {

  return new Promise((resolve, reject) => {

    const request =
      indexedDB.open(DB_NAME, DB_VERSION);

    request.onupgradeneeded = function(e) {

      const database = e.target.result;

      if (!database.objectStoreNames.contains(STORE_NAME)) {

        const store =
          database.createObjectStore(
            STORE_NAME,
            { keyPath: "id" }
          );

        store.createIndex(
          "name",
          "name",
          { unique: false }
        );
      }
    };

    request.onsuccess = function(e) {

      db = e.target.result;

      resolve(db);
    };

    request.onerror = function() {

      reject(request.error);
    };
  });
}


/* =========================
   データ保存
========================= */

function saveToDB(item) {

  return new Promise((resolve, reject) => {

    const tx =
      db.transaction(
        STORE_NAME,
        "readwrite"
      );

    tx.objectStore(STORE_NAME)
      .put(item);

    tx.oncomplete = () => resolve();

    tx.onerror = () =>
      reject(tx.error);
  });
}


/* =========================
   全件取得
========================= */

function getAllItems() {

  return new Promise((resolve, reject) => {

    const tx =
      db.transaction(
        STORE_NAME,
        "readonly"
      );

    const request =
      tx.objectStore(STORE_NAME)
        .getAll();

    request.onsuccess = () =>
      resolve(request.result);

    request.onerror = () =>
      reject(request.error);
  });
}


/* =========================
   1件取得
========================= */

function getItem(id) {

  return new Promise((resolve, reject) => {

    const tx =
      db.transaction(
        STORE_NAME,
        "readonly"
      );

    const request =
      tx.objectStore(STORE_NAME)
        .get(id);

    request.onsuccess = () =>
      resolve(request.result);

    request.onerror = () =>
      reject(request.error);
  });
}


/* =========================
   削除
========================= */

function deleteFromDB(id) {

  return new Promise((resolve, reject) => {

    const tx =
      db.transaction(
        STORE_NAME,
        "readwrite"
      );

    tx.objectStore(STORE_NAME)
      .delete(id);

    tx.oncomplete = () =>
      resolve();

    tx.onerror = () =>
      reject(tx.error);
  });
}


/* =========================
   ID
========================= */

function createId() {

  return "I" +
    Date.now().toString(36) +
    Math.random()
      .toString(36)
      .substring(2, 8);
}


/* =========================
   画面切替
========================= */

function hideAllScreens() {

  document
    .getElementById("homeScreen")
    .classList.add("hidden");

  document
    .getElementById("formScreen")
    .classList.add("hidden");

  document
    .getElementById("detailScreen")
    .classList.add("hidden");
}


function showHome() {

  hideAllScreens();

  document
    .getElementById("homeScreen")
    .classList.remove("hidden");

  showAllItems();
}


/* =========================
   登録画面
========================= */

function showRegister() {

  hideAllScreens();

  editingId = null;
  selectedImageData = null;

  document
    .getElementById("formScreen")
    .classList.remove("hidden");

  document
    .getElementById("formTitle")
    .textContent = "備品登録";

  clearForm();
}


/* =========================
   フォームクリア
========================= */

function clearForm() {

  document.getElementById("name").value = "";
  document.getElementById("spec").value = "";
  document.getElementById("image").value = "";
  document.getElementById("location").value = "";
  document.getElementById("obtained").value = "";
  document.getElementById("expiry").value = "";
  document.getElementById("store").value = "";
  document.getElementById("price").value = "";
  document.getElementById("memo").value = "";

  const preview =
    document.getElementById("preview");

  preview.src = "";
  preview.classList.add("hidden");
}


/* =========================
   画像選択
========================= */

document
  .getElementById("image")
  .addEventListener("change", function(e) {

    const file = e.target.files[0];

    if (!file) return;

    const reader =
      new FileReader();

    reader.onload = function(event) {

      selectedImageData =
        event.target.result;

      const preview =
        document.getElementById("preview");

      preview.src =
        selectedImageData;

      preview.classList.remove(
        "hidden"
      );
    };

    reader.readAsDataURL(file);
  });


/* =========================
   保存
========================= */

async function saveItem() {

  const name =
    document.getElementById("name")
      .value.trim();

  if (!name) {

    alert("名称を入力してください。");

    return;
  }

  const now =
    new Date().toISOString();

  let item;

  if (editingId) {

    const oldItem =
      await getItem(editingId);

    item = {

      ...oldItem,

      name:
        document.getElementById("name")
          .value.trim(),

      spec:
        document.getElementById("spec")
          .value.trim(),

      location:
        document.getElementById("location")
          .value.trim(),

      obtained:
        document.getElementById("obtained")
          .value,

      expiry:
        document.getElementById("expiry")
          .value,

      store:
        document.getElementById("store")
          .value.trim(),

      price:
        document.getElementById("price")
          .value,

      memo:
        document.getElementById("memo")
          .value.trim(),

      updatedAt: now
    };

    if (selectedImageData) {

      item.image =
        selectedImageData;
    }

  } else {

    item = {

      id: createId(),

      name:
        document.getElementById("name")
          .value.trim(),

      spec:
        document.getElementById("spec")
          .value.trim(),

      image:
        selectedImageData || "",

      location:
        document.getElementById("location")
          .value.trim(),

      obtained:
        document.getElementById("obtained")
          .value,

      expiry:
        document.getElementById("expiry")
          .value,

      store:
        document.getElementById("store")
          .value.trim(),

      price:
        document.getElementById("price")
          .value,

      memo:
        document.getElementById("memo")
          .value.trim(),

      createdAt: now,

      updatedAt: now
    };
  }

  await saveToDB(item);

  alert(
    editingId
      ? "変更を保存しました。"
      : "登録しました。"
  );

  showDetail(item.id);
}


/* =========================
   編集
========================= */

async function editItem(id) {

  const item =
    await getItem(id);

  if (!item) return;

  editingId = id;

  selectedImageData = null;

  hideAllScreens();

  document
    .getElementById("formScreen")
    .classList.remove("hidden");

  document
    .getElementById("formTitle")
    .textContent = "備品を編集";

  document.getElementById("name")
    .value = item.name || "";

  document.getElementById("spec")
    .value = item.spec || "";

  document.getElementById("location")
    .value = item.location || "";

  document.getElementById("obtained")
    .value = item.obtained || "";

  document.getElementById("expiry")
    .value = item.expiry || "";

  document.getElementById("store")
    .value = item.store || "";

  document.getElementById("price")
    .value = item.price || "";

  document.getElementById("memo")
    .value = item.memo || "";

  document.getElementById("image")
    .value = "";

  const preview =
    document.getElementById("preview");

  if (item.image) {

    preview.src = item.image;

    preview.classList.remove(
      "hidden"
    );

  } else {

    preview.classList.add(
      "hidden"
    );
  }
}


function editCurrentItem() {

  if (currentItemId) {

    editItem(currentItemId);
  }
}


/* =========================
   一覧
========================= */

async function showAllItems() {

  const items =
    await getAllItems();

  displayItems(items);
}


function displayItems(items) {

  const list =
    document.getElementById("itemList");

  list.innerHTML = "";

  if (!items.length) {

    list.innerHTML =
      '<div class="empty">' +
      '登録された備品はありません。' +
      '</div>';

    return;
  }

  items.sort((a,b) =>
    (a.name || "")
      .localeCompare(
        b.name || "",
        "ja"
      )
  );

  items.forEach(item => {

    const card =
      document.createElement("div");

    card.className =
      "card item-card";

    card.onclick = () =>
      showDetail(item.id);

    const image =
      document.createElement("img");

    image.className =
      "item-image";

    image.src =
      item.image || "";

    const info =
      document.createElement("div");

    info.className =
      "item-info";

    const name =
      document.createElement("div");

    name.className =
      "item-name";

    name.textContent =
      item.name || "名称なし";

    const location =
      document.createElement("div");

    location.className =
      "item-location";

    location.textContent =
      "📍 " +
      (item.location || "未設定");

    const expiry =
      document.createElement("div");

    expiry.textContent =
      "期限： " +
      (item.expiry || "なし");

    setExpiryClass(
      expiry,
      item.expiry
    );

    info.appendChild(name);
    info.appendChild(location);
    info.appendChild(expiry);

    card.appendChild(image);
    card.appendChild(info);

    list.appendChild(card);
  });
}


/* =========================
   検索
========================= */

async function searchItems() {

  const keyword =
    document.getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  const items =
    await getAllItems();

  if (!keyword) {

    displayItems(items);

    return;
  }

  const result =
    items.filter(item => {

      const text = [

        item.name,
        item.spec,
        item.location,
        item.store,
        item.memo

      ].join(" ")
       .toLowerCase();

      return text.includes(keyword);
    });

  displayItems(result);
}


/* =========================
   詳細
========================= */

async function showDetail(id) {

  const item =
    await getItem(id);

  if (!item) return;

  currentItemId = id;

  hideAllScreens();

  document
    .getElementById("detailScreen")
    .classList.remove("hidden");

  const container =
    document.getElementById(
      "detailContent"
    );

  container.innerHTML = "";

  if (item.image) {

    const image =
      document.createElement("img");

    image.className =
      "detail-image";

    image.src =
      item.image;

    container.appendChild(image);
  }

  addDetail(
    container,
    "名称",
    item.name
  );

  addDetail(
    container,
    "仕様（サイズ）",
    item.spec
  );

  addDetail(
    container,
    "保管場所",
    item.location
  );

  addDetail(
    container,
    "入手時期",
    item.obtained
  );

  const expiryRow =
    addDetail(
      container,
      "保管期限",
      item.expiry
    );

  if (item.expiry) {

    setExpiryClass(
      expiryRow.querySelector(
        ".detail-value"
      ),
      item.expiry
    );
  }

  addDetail(
    container,
    "購入先",
    item.store
  );

  addDetail(
    container,
    "価格",
    item.price
      ? Number(item.price)
          .toLocaleString() + " 円"
      : ""
  );

  addDetail(
    container,
    "備考",
    item.memo
  );
}


function addDetail(
  container,
  label,
  value
) {

  const row =
    document.createElement("div");

  row.className =
    "detail-row";

  const labelEl =
    document.createElement("div");

  labelEl.className =
    "detail-label";

  labelEl.textContent =
    label;

  const valueEl =
    document.createElement("div");

  valueEl.className =
    "detail-value";

  valueEl.textContent =
    value || "－";

  row.appendChild(labelEl);
  row.appendChild(valueEl);

  container.appendChild(row);

  return row;
}


/* =========================
   期限判定
========================= */

function setExpiryClass(
  element,
  expiry
) {

  element.classList.remove(
    "expired",
    "expiring"
  );

  if (!expiry) return;

  const today =
    new Date();

  today.setHours(
    0,0,0,0
  );

  const limit =
    new Date(expiry);

  limit.setHours(
    0,0,0,0
  );

  const diff =
    Math.floor(
      (limit - today) /
      86400000
    );

  if (diff < 0) {

    element.classList.add(
      "expired"
    );

  } else if (diff <= 30) {

    element.classList.add(
      "expiring"
    );
  }
}


/* =========================
   削除
========================= */

async function deleteCurrentItem() {

  if (!currentItemId) return;

  const item =
    await getItem(currentItemId);

  if (!item) return;

  const answer =
    confirm(
      "「" +
      item.name +
      "」を削除しますか？"
    );

  if (!answer) return;

  await deleteFromDB(
    currentItemId
  );

  currentItemId = null;

  alert("削除しました。");

  showHome();
}


/* =========================
   バックアップ
========================= */

async function exportBackup() {

  const items =
    await getAllItems();

  const data = {

    version: 1,

    exportedAt:
      new Date().toISOString(),

    items: items
  };

  const blob =
    new Blob(
      [JSON.stringify(data)],
      {
        type:
          "application/json"
      }
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  const date =
    new Date()
      .toISOString()
      .slice(0,10);

  a.href = url;

  a.download =
    "備品管理バックアップ_" +
    date +
    ".json";

  a.click();

  URL.revokeObjectURL(url);
}


/* =========================
   復元
========================= */

async function importBackup(event) {

  const file =
    event.target.files[0];

  if (!file) return;

  const answer =
    confirm(
      "バックアップから復元します。\n" +
      "現在のデータは上書きされませんが、" +
      "同じIDのデータは置き換わります。\n\n" +
      "続行しますか？"
    );

  if (!answer) return;

  try {

    const text =
      await file.text();

    const data =
      JSON.parse(text);

    if (!data.items ||
        !Array.isArray(data.items)) {

      throw new Error(
        "バックアップ形式が不正です。"
      );
    }

    for (const item of data.items) {

      await saveToDB(item);
    }

    alert(
      data.items.length +
      "件を復元しました。"
    );

    showAllItems();

  } catch(e) {

    alert(
      "復元に失敗しました。\n" +
      e.message
    );
  }

  event.target.value = "";
}


/* =========================
   初期化
========================= */

async function init() {

  await openDB();

  await showAllItems();
}

init();


/* =========================
   PWA
========================= */

if ("serviceWorker" in navigator) {

  window.addEventListener(
    "load",
    () => {

      navigator.serviceWorker
        .register("sw.js")
        .catch(
          error =>
            console.log(
              "Service Worker:",
              error
            )
        );
    }
  );
}

</script>

</body>
</html>
