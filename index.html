<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1976d2">
<link rel="manifest" href="manifest.json">
<title>備品管理</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#f3f4f6;color:#333}header{background:#1976d2;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:10}header h1{margin:0;font-size:20px}main{max-width:700px;margin:auto;padding:12px}button{border:0;border-radius:8px;padding:11px 15px;font-size:15px;cursor:pointer}.primary{background:#1976d2;color:#fff}.secondary{background:#e5e7eb;color:#333}.danger{background:#d32f2f;color:#fff}.full{width:100%}.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.search-box{display:flex;gap:8px;margin-bottom:10px}.search-box input{flex:1}input,select,textarea{width:100%;padding:11px;font-size:16px;border:1px solid #ccc;border-radius:7px;background:#fff}textarea{min-height:90px}.form-group{margin-bottom:14px}.form-group label{display:block;font-weight:bold;margin-bottom:5px}.card{background:#fff;border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.12)}.item-card{display:flex;gap:12px;cursor:pointer}.item-image{width:90px;height:90px;object-fit:cover;border-radius:7px;background:#eee;flex-shrink:0}.no-image{display:flex;align-items:center;justify-content:center;color:#999;font-size:12px}.item-info{flex:1;min-width:0}.item-name{font-weight:bold;font-size:17px;margin-bottom:5px}.item-location{color:#555;margin-bottom:3px}.expired{color:#d32f2f;font-weight:bold}.expiring{color:#ef6c00;font-weight:bold}.detail-image{width:100%;max-height:350px;object-fit:contain;background:#eee;border-radius:8px;margin-bottom:15px}.detail-row{padding:10px 0;border-bottom:1px solid #eee}.detail-label{font-size:13px;color:#777}.detail-value{font-size:16px;margin-top:3px;white-space:pre-wrap}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.hidden{display:none!important}.preview{width:100%;max-height:250px;object-fit:contain;margin-top:8px;border-radius:8px;background:#eee}.empty{text-align:center;color:#777;padding:30px 10px}.small{font-size:13px;color:#777}.info-box{background:#eef5ff;border-radius:8px;padding:12px;margin-bottom:12px;font-size:14px}hr{border:0;border-top:1px solid #ddd;margin:18px 0}.image-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.select-with-button{display:grid;grid-template-columns:1fr auto;gap:8px}.setting-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #eee}.setting-used{font-size:12px;color:#777;margin-top:3px}.filter-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px}.active-filter{outline:3px solid #90caf9}.db-status{font-weight:bold;font-size:14px;margin:0 0 10px}.db-box button{margin-bottom:8px}.bottom-db{margin-top:18px}.badge{font-size:12px;color:#555;margin-left:5px}
</style>
</head>
<body>
<header><h1>📦 備品管理</h1></header>
<main>
<section id="homeScreen">
  <div class="card db-box">
    <div class="db-status" id="activeDbName">現在のDB：備品管理</div>
    <div class="menu">
      <button class="primary" onclick="newDatabase()">＋ 新しいDB</button>
      <button class="secondary" onclick="openDbSelector()">📂 DBを選択</button>
    </div>
    <div id="savedDbSelector" class="hidden">
      <div class="info-box">「現在のDBを保存」で保存したDBだけを選択できます。</div>
      <select id="savedDbSelect"><option value="">保存済みDBを選択</option></select>
      <br><br>
      <button class="secondary full" onclick="loadSelectedSavedDb()">📂 選択したDBを開く</button>
      <br><br>
      <label class="secondary full" style="display:block;text-align:center;cursor:pointer">📥 外部DBファイルを読み込む
        <input type="file" accept=".json,application/json" style="display:none" onchange="importDatabase(event)">
      </label>
    </div>
    <button class="secondary full" onclick="showMaintenance()">⚙️ 候補リストを管理</button>
  </div>

  <div class="menu">
    <button class="primary" onclick="showRegister()">＋ 備品を登録</button>
    <button class="secondary" onclick="showAllItems()">📋 一覧を見る</button>
  </div>

  <div class="search-box">
    <input id="searchInput" type="search" placeholder="名称・仕様・場所・購入先・備考で検索">
    <button class="primary" onclick="refreshList()">🔎</button>
  </div>
  <div class="filter-row">
    <button id="filterAll" class="secondary active-filter" onclick="setImageFilter('all')">すべて</button>
    <button id="filterWith" class="secondary" onclick="setImageFilter('with')">🖼 画像あり</button>
    <button id="filterWithout" class="secondary" onclick="setImageFilter('without')">🚫 画像なし</button>
  </div>
  <div id="searchInfo" class="small"></div>
  <div id="itemList"></div>

  <hr>
  <button class="secondary full" onclick="clearCache()">🧹 キャッシュをクリアして再読み込み</button>
  <div class="bottom-db">
    <button class="secondary full" onclick="exportBackup()">💾 バックアップを書き出す</button>
  </div>
  <label class="secondary full" style="display:block;text-align:center;cursor:pointer;margin-top:8px">
    🔄 バックアップを統合（マージ）
    <input type="file" accept=".json,application/json" style="display:none" onchange="mergeBackup(event)">
  </label>
</section>

<section id="formScreen" class="hidden"><div class="card">
<h2 id="formTitle">備品登録</h2>
<div class="form-group"><label>名称</label><input id="name"></div>
<div class="form-group"><label>仕様（サイズ）</label><input id="spec"></div>
<div class="form-group"><label>個数</label><input id="quantity" type="number" min="0" step="1" inputmode="numeric"></div>
<div class="form-group"><label>画像</label><div class="image-buttons"><button type="button" class="primary" onclick="takePhoto()">📷 カメラで撮影</button><button type="button" class="secondary" onclick="selectPhoto()">🖼 写真から選択</button></div><input id="cameraInput" type="file" accept="image/*" capture="environment" style="display:none"><input id="fileInput" type="file" accept="image/*" style="display:none"><img id="preview" class="preview hidden"></div>
<div class="form-group"><label>保管場所</label><div class="select-with-button"><select id="location"></select><button type="button" class="secondary" onclick="addLocation()">＋追加</button></div></div>
<div class="form-group"><label>入手時期</label><input id="obtained" type="date"></div>
<div class="form-group"><label>保管期限</label><input id="expiry" type="date"></div>
<div class="form-group"><label>購入先</label><div class="select-with-button"><select id="store"></select><button type="button" class="secondary" onclick="addStore()">＋追加</button></div></div>
<div class="form-group"><label>価格</label><input id="price" type="number" inputmode="numeric"></div>
<div class="form-group"><label>備考</label><textarea id="memo"></textarea></div>
<button class="primary full" onclick="saveItem()">💾 保存する</button><br><br><button class="secondary full" onclick="showHome()">戻る</button>
</div></section>

<section id="detailScreen" class="hidden"><div class="card"><div id="detailContent"></div><div class="actions"><button class="primary" onclick="editCurrentItem()">✏️ 編集</button><button class="danger" onclick="deleteCurrentItem()">🗑️ 削除</button></div><br><button class="secondary full" onclick="showHome()">戻る</button></div></section>

<section id="maintenanceScreen" class="hidden"><div class="card">
<h2>⚙️ 候補リストを管理</h2>
<div class="info-box">ここで削除するのは「候補」だけです。登録済み備品の保管場所・購入先のデータは変更しません。</div>
<h3>保管場所</h3><div id="locationMaintenance"></div><button class="primary full" onclick="addLocationFromSettings()">＋ 保管場所を追加</button>
<hr><h3>購入先</h3><div id="storeMaintenance"></div><button class="primary full" onclick="addStoreFromSettings()">＋ 購入先を追加</button>
<br><br><button class="secondary full" onclick="showHome()">戻る</button>
</div></section>
</main>
<script>
const DB_NAME='BihinKanriDB',DB_VERSION=4,STORE_NAME='items',CATALOG_STORE='dbCatalog';
const LEGACY_SETTINGS='BihinKanriSettings',ACTIVE_DB_KEY='BihinKanriActiveDBName';
const DEFAULT_LOCATIONS=['工具棚A','工具棚B','ガレージ','物置','パントリー','倉庫','車庫'];
const DEFAULT_STORES=['カインズ','コーナン','Amazon','楽天市場','モノタロウ','その他'];
let db,currentItemId=null,editingId=null,selectedImageData=null,imageFilter='all';
let activeDbName=localStorage.getItem(ACTIVE_DB_KEY)||'備品管理';

const $=id=>document.getElementById(id);
function createId(){return 'I'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function hideAllScreens(){['homeScreen','formScreen','detailScreen','maintenanceScreen'].forEach(id=>$(id).classList.add('hidden'))}
function showHome(){hideAllScreens();$('homeScreen').classList.remove('hidden');updateDbName();refreshList()}
function updateDbName(){ $('activeDbName').textContent='現在のDB：'+activeDbName; localStorage.setItem(ACTIVE_DB_KEY,activeDbName) }
function getSettings(){
 const s=localStorage.getItem(LEGACY_SETTINGS); if(!s)return {locations:[...DEFAULT_LOCATIONS],stores:[...DEFAULT_STORES]};
 try{const d=JSON.parse(s);return {locations:Array.isArray(d.locations)?d.locations:[...DEFAULT_LOCATIONS],stores:Array.isArray(d.stores)?d.stores:[...DEFAULT_STORES]}}catch(e){return {locations:[...DEFAULT_LOCATIONS],stores:[...DEFAULT_STORES]}}
}
function saveSettings(s){localStorage.setItem(LEGACY_SETTINGS,JSON.stringify(s))}
function setSettings(s){saveSettings({locations:[...(s.locations||[])],stores:[...(s.stores||[])]})}
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(STORE_NAME)){const st=d.createObjectStore(STORE_NAME,{keyPath:'id'});st.createIndex('name','name',{unique:false})}if(!d.objectStoreNames.contains(CATALOG_STORE))d.createObjectStore(CATALOG_STORE,{keyPath:'name'})};r.onsuccess=e=>{db=e.target.result;resolve(db)};r.onerror=()=>reject(r.error)})}
function getAllItems(){return new Promise((res,rej)=>{const r=db.transaction(STORE_NAME,'readonly').objectStore(STORE_NAME).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function getItem(id){return new Promise((res,rej)=>{const r=db.transaction(STORE_NAME,'readonly').objectStore(STORE_NAME).get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}
function saveToDB(item){return new Promise((res,rej)=>{const tx=db.transaction(STORE_NAME,'readwrite');tx.objectStore(STORE_NAME).put(item);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
function deleteFromDB(id){return new Promise((res,rej)=>{const tx=db.transaction(STORE_NAME,'readwrite');tx.objectStore(STORE_NAME).delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
function clearDB(){return new Promise((res,rej)=>{const tx=db.transaction(STORE_NAME,'readwrite');tx.objectStore(STORE_NAME).clear();tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
function saveCatalog(data){return new Promise((res,rej)=>{const tx=db.transaction(CATALOG_STORE,'readwrite');tx.objectStore(CATALOG_STORE).put(data);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
function getCatalogs(){return new Promise((res,rej)=>{const r=db.transaction(CATALOG_STORE,'readonly').objectStore(CATALOG_STORE).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function getCatalog(name){return new Promise((res,rej)=>{const r=db.transaction(CATALOG_STORE,'readonly').objectStore(CATALOG_STORE).get(name);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}

function refreshLocationList(selected=''){const s=$('location'),set=getSettings();s.innerHTML='<option value="">選択してください</option>';set.locations.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o)});if(selected){if(!set.locations.includes(selected)){const o=document.createElement('option');o.value=selected;o.textContent=selected;s.appendChild(o)}s.value=selected}}
function refreshStoreList(selected=''){const s=$('store'),set=getSettings();s.innerHTML='<option value="">選択してください</option>';set.stores.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o)});if(selected){if(!set.stores.includes(selected)){const o=document.createElement('option');o.value=selected;o.textContent=selected;s.appendChild(o)}s.value=selected}}
function addLocation(){const v=prompt('追加する保管場所を入力してください。');if(v===null)return;const n=v.trim();if(!n)return;const s=getSettings();if(!s.locations.includes(n))s.locations.push(n);saveSettings(s);refreshLocationList(n)}
function addStore(){const v=prompt('追加する購入先を入力してください。');if(v===null)return;const n=v.trim();if(!n)return;const s=getSettings();if(!s.stores.includes(n))s.stores.push(n);saveSettings(s);refreshStoreList(n)}

function normalizeJapanese(text){return String(text??'').normalize('NFKC').replace(/[ァ-ヶ]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0x60)).toLowerCase()}
function setImageFilter(v){imageFilter=v;['filterAll','filterWith','filterWithout'].forEach(id=>$(id).classList.remove('active-filter'));$('filter'+(v==='all'?'All':v==='with'?'With':'Without')).classList.add('active-filter');refreshList()}
async function refreshList(){const items=await getAllItems();const key=normalizeJapanese($('searchInput').value.trim());let r=items.filter(item=>{if(imageFilter==='with'&&!item.image)return false;if(imageFilter==='without'&&item.image)return false;if(!key)return true;return [item.name,item.spec,item.location,item.store,item.memo].some(x=>normalizeJapanese(x).includes(key))});displayItems(r);$('searchInfo').textContent='表示：'+r.length+'件 / 登録：'+items.length+'件'+(key?'　検索語：「'+$('searchInput').value.trim()+'」':'')}
function displayItems(items){const list=$('itemList');list.innerHTML='';if(!items.length){list.innerHTML='<div class="empty">該当する備品はありません。</div>';return}items.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ja'));items.forEach(item=>{const card=document.createElement('div');card.className='card item-card';card.onclick=()=>showDetail(item.id);if(item.image){const im=document.createElement('img');im.className='item-image';im.src=item.image;im.alt=item.name||'';card.appendChild(im)}else{const no=document.createElement('div');no.className='item-image no-image';no.textContent='画像なし';card.appendChild(no)}const info=document.createElement('div');info.className='item-info';const n=document.createElement('div');n.className='item-name';n.textContent=(item.name||'名称なし')+(item.quantity!==undefined&&item.quantity!==''?'　×'+item.quantity:'');const l=document.createElement('div');l.className='item-location';l.textContent='📍 '+(item.location||'未設定');const e=document.createElement('div');e.textContent='期限：'+(item.expiry||'なし');setExpiryClass(e,item.expiry);info.append(n,l,e);card.appendChild(info);list.appendChild(card)})}
function setExpiryClass(el,expiry){el.classList.remove('expired','expiring');if(!expiry)return;const t=new Date();t.setHours(0,0,0,0);const d=new Date(expiry);d.setHours(0,0,0,0);const diff=Math.floor((d-t)/86400000);if(diff<0)el.classList.add('expired');else if(diff<=30)el.classList.add('expiring')}

function showRegister(){hideAllScreens();editingId=null;selectedImageData=null;$('formScreen').classList.remove('hidden');$('formTitle').textContent='備品登録';clearForm();refreshLocationList();refreshStoreList()}
function clearForm(){['name','spec','quantity','obtained','expiry','price','memo'].forEach(id=>$(id).value='');$('cameraInput').value='';$('fileInput').value='';$('preview').src='';$('preview').classList.add('hidden')}
function takePhoto(){$('cameraInput').click()}function selectPhoto(){$('fileInput').click()}
function handleImage(e){const f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')){alert('画像ファイルを選択してください。');return}const r=new FileReader();r.onload=x=>{selectedImageData=x.target.result;$('preview').src=selectedImageData;$('preview').classList.remove('hidden')};r.readAsDataURL(f)}
$('cameraInput').addEventListener('change',handleImage);$('fileInput').addEventListener('change',handleImage);
async function saveItem(){const name=$('name').value.trim();if(!name){alert('名称を入力してください。');return}const now=new Date().toISOString();let item;if(editingId){const old=await getItem(editingId);if(!old)return;item={...old,name,spec:$('spec').value.trim(),quantity:$('quantity').value,location:$('location').value,obtained:$('obtained').value,expiry:$('expiry').value,store:$('store').value,price:$('price').value,memo:$('memo').value.trim(),updatedAt:now};if(selectedImageData)item.image=selectedImageData}else{item={id:createId(),name,spec:$('spec').value.trim(),quantity:$('quantity').value,image:selectedImageData||'',location:$('location').value,obtained:$('obtained').value,expiry:$('expiry').value,store:$('store').value,price:$('price').value,memo:$('memo').value.trim(),createdAt:now,updatedAt:now}};const s=getSettings();if(item.location&&!s.locations.includes(item.location))s.locations.push(item.location);if(item.store&&!s.stores.includes(item.store))s.stores.push(item.store);saveSettings(s);await saveToDB(item);alert(editingId?'変更を保存しました。':'登録しました。');showDetail(item.id)}
async function editItem(id){const item=await getItem(id);if(!item)return;editingId=id;selectedImageData=null;hideAllScreens();$('formScreen').classList.remove('hidden');$('formTitle').textContent='備品を編集';$('name').value=item.name||'';$('spec').value=item.spec||'';$('quantity').value=item.quantity??'';$('obtained').value=item.obtained||'';$('expiry').value=item.expiry||'';$('price').value=item.price||'';$('memo').value=item.memo||'';$('cameraInput').value='';$('fileInput').value='';refreshLocationList(item.location||'');refreshStoreList(item.store||'');if(item.image){$('preview').src=item.image;$('preview').classList.remove('hidden')}else $('preview').classList.add('hidden')}
function editCurrentItem(){if(currentItemId)editItem(currentItemId)}
async function showDetail(id){const item=await getItem(id);if(!item)return;currentItemId=id;hideAllScreens();$('detailScreen').classList.remove('hidden');const c=$('detailContent');c.innerHTML='';if(item.image){const im=document.createElement('img');im.className='detail-image';im.src=item.image;im.alt=item.name||'';c.appendChild(im)}addDetail(c,'名称',item.name);addDetail(c,'仕様（サイズ）',item.spec);addDetail(c,'個数',item.quantity);addDetail(c,'保管場所',item.location);addDetail(c,'入手時期',item.obtained);const er=addDetail(c,'保管期限',item.expiry);if(item.expiry)setExpiryClass(er.querySelector('.detail-value'),item.expiry);addDetail(c,'購入先',item.store);addDetail(c,'価格',item.price?Number(item.price).toLocaleString()+' 円':'');addDetail(c,'備考',item.memo)}
function addDetail(c,label,value){const r=document.createElement('div');r.className='detail-row';const l=document.createElement('div');l.className='detail-label';l.textContent=label;const v=document.createElement('div');v.className='detail-value';v.textContent=value||'－';r.append(l,v);c.appendChild(r);return r}
async function deleteCurrentItem(){if(!currentItemId)return;const item=await getItem(currentItemId);if(!item||!confirm('「'+item.name+'」を削除しますか？'))return;await deleteFromDB(currentItemId);currentItemId=null;alert('削除しました。');showHome()}

async function showMaintenance(){hideAllScreens();$('maintenanceScreen').classList.remove('hidden');const s=getSettings(),items=await getAllItems();renderSettingList('locationMaintenance',s.locations,'location',items);renderSettingList('storeMaintenance',s.stores,'store',items)}
function renderSettingList(id,list,type,items){const c=$(id);c.innerHTML='';list.forEach((v,i)=>{const count=items.filter(x=>(x[type]||'')===v).length;const row=document.createElement('div');row.className='setting-row';const label=document.createElement('div');label.innerHTML='<b>'+escapeHtml(v)+'</b>'+(count?'<div class="setting-used">登録済み '+count+'件で使用中</div>':'');const b=document.createElement('button');b.className='danger';b.textContent='削除';b.onclick=()=>removeCandidate(type,i,v,count);row.append(label,b);c.appendChild(row)})}
function escapeHtml(v){const d=document.createElement('div');d.textContent=v;return d.innerHTML}
async function removeCandidate(type,index,value,count){const label=type==='location'?'保管場所':'購入先';if(count){if(!confirm('「'+value+'」は登録済み '+count+'件で使用中です。\n\n候補から削除しますか？\n\n※登録済みデータは変更されません。'))return;if(!confirm('もう一度確認します。\n「'+value+'」を候補から削除しますか？\n\nOK：削除する\nキャンセル：削除しない'))return}else if(!confirm('「'+value+'」を候補から削除しますか？'))return;const s=getSettings(),arr=type==='location'?s.locations:s.stores;arr.splice(index,1);saveSettings(s);await showMaintenance();alert(label+'の候補を削除しました。登録済みデータは変更していません。')}
function addLocationFromSettings(){addCandidate('location')}function addStoreFromSettings(){addCandidate('store')}
async function addCandidate(type){const label=type==='location'?'保管場所':'購入先';const v=prompt('追加する'+label+'を入力してください。');if(v===null)return;const n=v.trim();if(!n)return;const s=getSettings(),arr=type==='location'?s.locations:s.stores;if(arr.includes(n)){alert('すでに登録されています。');return}arr.push(n);saveSettings(s);await showMaintenance()}

async function exportDatabase(){const items=await getAllItems(),s=getSettings();const data={formatVersion:4,dbName:activeDbName,exportedAt:new Date().toISOString(),settings:s,items};await saveCatalog({name:activeDbName,dbName:activeDbName,settings:s,items:JSON.parse(JSON.stringify(items)),savedAt:new Date().toISOString()});downloadJson(data,activeDbName+'_DB_'+today()+'.json');await refreshSavedDbSelector();alert('「'+activeDbName+'」を保存しました。\n\n次回から「DBを選択」でこのDBを選べます。')}
function exportBackup(){exportDatabase()}
function downloadJson(data,name){const blob=new Blob([JSON.stringify(data)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}function today(){return new Date().toISOString().slice(0,10)}
async function openDbSelector(){const box=$('savedDbSelector');box.classList.toggle('hidden');if(!box.classList.contains('hidden'))await refreshSavedDbSelector()}
async function refreshSavedDbSelector(){const s=$('savedDbSelect'),list=await getCatalogs();list.sort((a,b)=>String(a.name).localeCompare(String(b.name),'ja'));s.innerHTML='<option value="">保存済みDBを選択</option>';list.forEach(x=>{const o=document.createElement('option');o.value=x.name;o.textContent=x.name;s.appendChild(o)})}
async function loadSelectedSavedDb(){const name=$('savedDbSelect').value;if(!name){alert('DBを選択してください。');return}const data=await getCatalog(name);if(!data){alert('保存済みDBが見つかりません。');return}if(!confirm('保存済みDB「'+name+'」を開きますか？\n\n現在のDBの未保存変更は引き継がれません。'))return;await loadDatabaseData(data);$('savedDbSelector').classList.add('hidden');alert('DBを開きました。\n\n'+name+'：'+(data.items||[]).length+'件')}
async function loadDatabaseData(data){await clearDB();for(const raw of data.items||[]){if(!raw||typeof raw!=='object')continue;const item={...raw,id:raw.id?String(raw.id):createId()};const now=new Date().toISOString();if(!item.createdAt)item.createdAt=now;if(!item.updatedAt)item.updatedAt=now;await saveToDB(item)}setSettings({locations:Array.isArray(data.settings?.locations)?data.settings.locations:DEFAULT_LOCATIONS,stores:Array.isArray(data.settings?.stores)?data.settings.stores:DEFAULT_STORES});activeDbName=data.dbName||data.name||'備品管理';updateDbName();$('searchInput').value='';imageFilter='all';setImageFilter('all')}
async function newDatabase(){const v=prompt('新しいDB名を入力してください。\n例：園芸用品、工具、家電など');if(v===null)return;const name=v.trim();if(!name)return;if(!confirm('新しいDB「'+name+'」を作成しますか？\n\n現在のDBを保存していない場合は、先に「現在のDBを保存」してください。'))return;await clearDB();activeDbName=name;updateDbName();setSettings({locations:[...DEFAULT_LOCATIONS],stores:[...DEFAULT_STORES]});$('searchInput').value='';imageFilter='all';setImageFilter('all');await refreshSavedDbSelector();alert('新しいDBを作成しました。\n\nまだ「保存済みDB」にはなっていません。\n必要なら「現在のDBを保存」を押してください。')}
async function importDatabase(e){const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.items))throw new Error('DBファイルの形式が不正です。');data.dbName=data.dbName||f.name.replace(/\.json$/i,'');await saveCatalog({name:data.dbName,dbName:data.dbName,settings:{locations:Array.isArray(data.settings?.locations)?data.settings.locations:DEFAULT_LOCATIONS,stores:Array.isArray(data.settings?.stores)?data.settings.stores:DEFAULT_STORES},items:data.items,savedAt:new Date().toISOString()});await loadDatabaseData(data);await refreshSavedDbSelector();alert('DBファイルを読み込みました。\n\n'+data.dbName+'：'+data.items.length+'件')}catch(err){alert('DBの読み込みに失敗しました。\n\n'+err.message)}e.target.value=''}

async function mergeBackup(e){const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.items))throw new Error('バックアップ形式が不正です。');const current=new Map((await getAllItems()).map(x=>[String(x.id),x]));let add=0,upd=0;for(const raw of data.items){let item={...raw};let id=item.id?String(item.id):createId();item.id=id;if(current.has(id)){const old=current.get(id);if(!Object.prototype.hasOwnProperty.call(item,'image'))item.image=old.image||'';if(!item.createdAt)item.createdAt=old.createdAt;item.updatedAt=new Date().toISOString();upd++}else{const now=new Date().toISOString();item.createdAt=item.createdAt||now;item.updatedAt=item.updatedAt||now;add++}await saveToDB(item)}const s=getSettings();for(const x of data.settings?.locations||[])if(x&&!s.locations.includes(x))s.locations.push(x);for(const x of data.settings?.stores||[])if(x&&!s.stores.includes(x))s.stores.push(x);saveSettings(s);await refreshList();alert('バックアップを統合しました。\n\n新規追加：'+add+'件\n更新：'+upd+'件')}catch(err){alert('統合に失敗しました。\n\n'+err.message)}e.target.value=''}
async function clearCache(){if(!confirm('キャッシュをクリアして再読み込みします。\n\n備品データは削除されません。'))return;try{for(const k of await caches.keys())await caches.delete(k);for(const r of await navigator.serviceWorker.getRegistrations())await r.update()}catch(e){}location.reload()}

async function init(){await openDB();updateDbName();refreshLocationList();refreshStoreList();await refreshList();await refreshSavedDbSelector()}
init();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js?v=5').catch(console.log));
</script>
